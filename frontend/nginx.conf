server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Fichiers compilés : leur nom change à chaque version, ils peuvent rester en cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Toutes les autres adresses renvoient l'application (routage côté navigateur).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
